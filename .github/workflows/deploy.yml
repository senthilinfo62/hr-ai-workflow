name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: Run backend tests
      run: |
        cd backend
        pytest
        
    - name: Run backend linting
      run: |
        cd backend
        black --check .
        isort --check-only --profile black .
        mypy src
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
        
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Create deployment directory if it doesn't exist
          mkdir -p ~/hr-ai-workflow
          
          # Clone or pull the latest code
          if [ -d "~/hr-ai-workflow/.git" ]; then
            cd ~/hr-ai-workflow
            git pull
          else
            git clone https://github.com/senthilinfo62/hr-ai-workflow.git ~/hr-ai-workflow
            cd ~/hr-ai-workflow
          fi
          
          # Set up backend
          cd ~/hr-ai-workflow/backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          
          # Set up environment variables
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export DB_HOST="${{ secrets.DB_HOST }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          
          # Restart backend service
          sudo systemctl restart hr-ai-backend.service
          
          # Deploy frontend
          cd ~/hr-ai-workflow/frontend
          npm ci
          npm run build
          
          # Copy frontend build to web server directory
          sudo cp -r dist/* /var/www/hr-ai-workflow/
          
          # Restart web server if needed
          sudo systemctl restart nginx
